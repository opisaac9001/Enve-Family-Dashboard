name: EnveFamily
options:
  bundleIdPrefix: com.enve
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENVE_APP_GROUP: group.com.enve.family
targets:
  EnveFamily:
    type: application
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - EnveFamily
      - Shared
    dependencies:
      - target: EnveFamilyShare
    entitlements:
      path: EnveFamily/EnveFamily.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.enve.family
    info:
      path: EnveFamily/Info.plist
      properties:
        CFBundleDisplayName: Enve Family
        EnveAppGroup: $(ENVE_APP_GROUP)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: true
        NSLocalNetworkUsageDescription: Enve Family connects to your household dashboard server on your local network.
        NSCameraUsageDescription: Enve Family uses the camera to photograph flyers, lists, and recipes so your dashboard server can turn them into drafts you review before saving.
        NSMicrophoneUsageDescription: Enve Family uses the microphone when you dictate text to import as events, tasks, lists, or recipes.
        NSSpeechRecognitionUsageDescription: Enve Family turns your dictation into text on this iPhone so you can review it before finding drafts. Audio isn't sent to Apple or your server.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.family
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  EnveFamilyShare:
    type: app-extension
    platform: iOS
    attributes:
      SystemCapabilities:
        com.apple.ApplicationGroups.iOS:
          enabled: 1
    sources:
      - EnveFamilyShare
      - Shared
      - EnveFamily/Support/Color+Enve.swift
    entitlements:
      path: EnveFamilyShare/EnveFamilyShare.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.enve.family
    info:
      path: EnveFamilyShare/Info.plist
      properties:
        CFBundleDisplayName: Enve Family
        EnveAppGroup: $(ENVE_APP_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareViewController
          NSExtensionAttributes:
            NSExtensionActivationRule: >-
              SUBQUERY(extensionItems, $extensionItem,
              SUBQUERY($extensionItem.attachments, $attachment,
              ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.plain-text"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.url"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.image"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "com.adobe.pdf"
              || ANY $attachment.registeredTypeIdentifiers UTI-CONFORMS-TO "public.calendar-event"
              ).@count >= 1).@count >= 1
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enve.family.share
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
