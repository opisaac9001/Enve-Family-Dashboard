name: Check

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: bash -n image/build-raspberry-pi.sh image/raspberry-pi/stage/prerun.sh image/raspberry-pi/stage/01-enve/00-run.sh
      - run: sh -n image/install-enve.sh pi-native/install-tailscale.sh
      - run: docker build -t enve-family-dashboard:ci .
