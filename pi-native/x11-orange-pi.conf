Section "ServerFlags"
    Option "AutoAddGPU" "false"
EndSection

Section "Device"
    Identifier "Enve HDMI"
    Driver "modesetting"
    Option "kmsdev" "/dev/dri/card0"
    Option "AccelMethod" "glamor"
EndSection

Section "Monitor"
    Identifier "Enve monitor"
    Option "PreferredMode" "1920x1200"
EndSection

Section "Screen"
    Identifier "Enve screen"
    DefaultDepth 24
    Device "Enve HDMI"
    Monitor "Enve monitor"
EndSection
